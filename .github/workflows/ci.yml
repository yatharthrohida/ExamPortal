name: ExamPortal CI

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: examportal-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: server
      - name: Run backend tests
        run: npm test
        working-directory: server

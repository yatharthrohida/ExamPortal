name: ExamPortal CI

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exam_portal_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exam_portal_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: exam_portal_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_CONNECTION_TIMEOUT_MS: 3000
      JWT_SECRET: ci_test_secret_with_at_least_32_characters_long
      CLIENT_ORIGIN: http://localhost:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: server
      - name: Apply database migrations
        run: npm run migrate
        working-directory: server
      - name: Run backend tests
        run: npm test
        working-directory: server
